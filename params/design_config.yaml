# 设计参数模板 —— 复制成自己的配置再填。
# 值为 null 的项都是**阻塞项**：填完之前工具不会生成任何序列。
# 校验：python -m ssdna.design --config 本文件

schema: scaffold_staple_design/design_config/v1

scaffold:
  file: "minimalplasmid(1).dna"
  # 实验室提供的环状单链，对应文件里的正链（+）还是负链（-）
  # 选错会让所有 13 nt 臂全部作废，必须实测确认。
  strand: null
  topology: circular

staple:
  # 这三个长度可调，但 total_length 必须等于两者之和，否则引擎报错。
  scaffold_binding_length: 13
  target_binding_length: 26
  total_length: 39
  # 13 nt 块的分组循环；"AB" = 严格交替（两组条数只差 1）
  group_pattern: "AB"
  # 26 nt 在 5′ 侧还是 13 nt 在 5′ 侧
  domain_order: "5p_target_26"
  # 覆盖区在 scaffold 上的起点（决定相位；可用 --scan-phase 挑一个 Tm 最均匀的）
  covered_start: 0

target:
  # FASTA 路径；null = 还没定目标序列
  source: null
  groups: [A, B]
  # A/B 分界（目标坐标）。例如 [364] 表示 A=[0,364)、B=[364,728)
  group_boundaries: null
  # 目标坐标上的 nick 位置（不含 0）。必须避开 26 的整数倍（staple 臂接缝）。
  oligo_cuts: null
  topology: circular      # 线性就填 linear（此时只有一个交界）
  boundary_count: 2       # 环状 2 个交界；线性 1 个
  # 合成 oligo 默认 5'-OH；要连接必须知道是否磷酸化
  five_prime_phosphate: null      # yes / no
  intended_ligation: null         # true / false

analysis:
  tm: true
  # 盐条件：只做同批横向比较，不作为绝对判据
  na_mM: 50.0
  mg_mM: 0.0
  dnac_nM: 250.0
  temperature_c: null     # 实验温度，用来判断 13 nt 臂是否够稳

output:
  outdir: outputs/design
